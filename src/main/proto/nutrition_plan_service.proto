syntax = "proto3";

package com.atlantis.nutritionist.grpc;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.atlantis.nutritionist.grpc.nutritionplan";
option java_outer_classname = "NutritionPlanServiceProto";

service NutritionPlanService {
  rpc CreateNutritionPlan(CreateNutritionPlanRequest) returns (NutritionPlanResponse);
  rpc GetNutritionPlan(GetNutritionPlanRequest) returns (NutritionPlanResponse);
  rpc UpdateNutritionPlan(UpdateNutritionPlanRequest) returns (NutritionPlanResponse);
  rpc DeactivatePlan(DeactivatePlanRequest) returns (NutritionPlanResponse);
  rpc GetClientPlans(GetClientPlansRequest) returns (ListNutritionPlansResponse);
  rpc GetActivePlan(GetActivePlanRequest) returns (NutritionPlanResponse);
}

message NutritionPlan {
  UUID id = 1;
  UUID client_id = 2;
  UUID nutritionist_id = 3;
  string plan_name = 4;

  // Macronutrients
  int32 calories_target = 5;
  optional double protein_grams = 6;
  optional double carbs_grams = 7;
  optional double fats_grams = 8;
  optional double fiber_grams = 9;

  // Dietary guidance
  optional string foods_to_avoid = 10;
  optional string foods_to_limit = 11;
  optional string foods_recommended = 12;

  // Clinical
  PlanType plan_type = 13;
  optional string medical_condition_target = 14;
  optional string description = 15;

  // Schedule
  string start_date = 16; // ISO 8601 date format
  optional string end_date = 17;
  bool is_active = 18;

  optional string notes = 19;
  Timestamp created_at = 20;
  Timestamp updated_at = 21;
}

message CreateNutritionPlanRequest {
  UUID client_id = 1;
  UUID nutritionist_id = 2;
  string plan_name = 3;
  int32 calories_target = 4;
  optional double protein_grams = 5;
  optional double carbs_grams = 6;
  optional double fats_grams = 7;
  optional double fiber_grams = 8;
  optional string foods_to_avoid = 9;
  optional string foods_to_limit = 10;
  optional string foods_recommended = 11;
  PlanType plan_type = 12;
  optional string medical_condition_target = 13;
  optional string description = 14;
  string start_date = 15;
  optional string end_date = 16;
}

message GetNutritionPlanRequest {
  UUID id = 1;
}

message UpdateNutritionPlanRequest {
  UUID id = 1;
  optional string plan_name = 2;
  optional int32 calories_target = 3;
  optional double protein_grams = 4;
  optional double carbs_grams = 5;
  optional double fats_grams = 6;
  optional double fiber_grams = 7;
  optional string foods_to_avoid = 8;
  optional string foods_to_limit = 9;
  optional string foods_recommended = 10;
  optional PlanType plan_type = 11;
  optional string medical_condition_target = 12;
  optional string description = 13;
  optional string end_date = 14;
  optional bool is_active = 15;
  optional string notes = 16;
}

message DeactivatePlanRequest {
  UUID id = 1;
}

message GetClientPlansRequest {
  UUID client_id = 1;
  PageRequest page_request = 2;
  optional bool active_only = 3;
}

message GetActivePlanRequest {
  UUID client_id = 1;
}

message ListNutritionPlansResponse {
  repeated NutritionPlan plans = 1;
  PageResponse page_response = 2;
}

message NutritionPlanResponse {
  NutritionPlan plan = 1;
}
