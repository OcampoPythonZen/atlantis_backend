spring.application.name=nutritionist

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nutritionist_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Logging Configuration
logging.level.org.flywaydb=DEBUG
logging.level.net.devh.boot.grpc=DEBUG

# gRPC Configuration
grpc.server.port=9090
grpc.server.address=0.0.0.0
grpc.server.max-inbound-message-size=10MB
grpc.server.keep-alive-time=300s
grpc.server.permit-keep-alive-without-calls=true

# JWT Configuration
jwt.secret=your-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000
jwt.issuer=nutritionist-app

# Security Configuration
spring.security.enabled=false
security.jwt.header-name=authorization
security.jwt.token-prefix=Bearer
grpc.server.security.enabled=false

# Validation Configuration
validation.password.min-length=8
validation.password.require-uppercase=true
validation.password.require-lowercase=true
validation.password.require-digit=true
validation.password.require-special=false

# Security Logging
logging.level.com.atlantis.nutritionist.security=DEBUG
logging.level.com.atlantis.nutritionist.exception=DEBUG
